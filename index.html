<!DOCTYPE html>
<html lang="mn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MongolFlix — Монгол Стриминг Платформ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0d12; color: #f3f4f6; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-red-600 selection:text-white">

  <!-- Дээд цэс (Navbar) -->
  <header class="sticky top-0 z-40 bg-[#0b0d12]/90 backdrop-blur-md border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-6">
        <button id="brandLogo" type="button" onclick="handleLogoClick()" class="flex items-center gap-2 text-left select-none focus:outline-none group">
          <span class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center shadow-lg shadow-red-600/30 group-active:scale-95 transition">
            <svg class="w-4 h-4 text-white fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </span>
          <span class="text-xl font-extrabold tracking-tight">
            <span class="text-red-500">MONGOL</span><span class="text-white">FLIX</span>
          </span>
        </button>

        <nav class="hidden md:flex items-center gap-5 text-sm font-medium text-gray-300">
          <button onclick="filterCategory('all')" class="hover:text-white transition">Нүүр</button>
          <button onclick="openPackageModal()" class="hover:text-amber-400 transition">Бүх багцууд</button>
          <button onclick="openWatchlist()" class="hover:text-white transition flex items-center gap-1.5">
            Миний жагсаалт
            <span id="watchlistCount" class="px-1.5 py-0.5 text-xs bg-red-600 text-white rounded-full">0</span>
          </button>
        </nav>
      </div>

      <div class="flex items-center gap-3">
        <div class="relative hidden sm:block">
          <input id="searchInput" type="text" oninput="renderMovies()" placeholder="Кино, багц хайх..." 
            class="w-48 lg:w-64 bg-white/5 border border-white/10 rounded-full pl-9 pr-4 py-1.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-red-500">
          <svg class="w-4 h-4 text-gray-400 absolute left-3 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>

        <button id="vipStatusBtn" onclick="openPackageModal()" class="px-3.5 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs sm:text-sm flex items-center gap-1.5 transition shadow-lg shadow-amber-500/20">
          <span>👑</span> <span id="vipStatusText">Багц авах</span>
        </button>

        <button onclick="openAdminAuth()" title="Админ удирдлага" class="p-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-gray-400 hover:text-white transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Онцлох кино (Hero Banner) -->
  <section class="relative overflow-hidden border-b border-white/10">
    <div class="absolute inset-0 bg-gradient-to-r from-[#0b0d12] via-[#0b0d12]/85 to-transparent z-10"></div>
    <img id="heroBannerImg" src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1600&q=80" alt="Hero" class="w-full h-[420px] sm:h-[460px] object-cover opacity-50">
    
    <div class="max-w-7xl mx-auto px-4 sm:px-6 relative z-20 -mt-[370px] sm:-mt-[400px] pb-12">
      <div class="max-w-xl">
        <div class="flex flex-wrap items-center gap-2 mb-3 text-xs font-semibold">
          <span class="px-2 py-0.5 bg-red-600 text-white rounded">ОНЦЛОХ</span>
          <span id="heroPkgBadge" class="px-2 py-0.5 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded">🇲🇳 Монгол багц</span>
          <span id="heroMeta" class="text-gray-300">2025 • Адал явдалт, Түүхэн</span>
          <span class="px-1.5 py-0.5 border border-white/20 rounded text-gray-300">4K Ultra HD</span>
        </div>

        <h1 id="heroTitle" class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight mb
